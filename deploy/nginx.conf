map $http_x_forwarded_proto $webfish_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# The host TLS proxy must overwrite X-Forwarded-For with the connecting
# client address. Direct loopback access falls back to the socket address.
map $http_x_forwarded_for $webfish_client_address {
    default $http_x_forwarded_for;
    ""      $binary_remote_addr;
}

map $uri $webfish_auth_limit_key {
    default                         "";
    ~*^/api/auth/(login|register)/?$  $webfish_client_address;
}

limit_req_zone $webfish_auth_limit_key zone=webfish_auth:10m rate=10r/m;

upstream webfish_api {
    server api:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/ {
        limit_req zone=webfish_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_pass http://webfish_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $webfish_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

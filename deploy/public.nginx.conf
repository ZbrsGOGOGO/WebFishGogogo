server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'none'; font-src 'self' data:; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header_inherit merge;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript image/svg+xml text/css text/plain;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location ~* ^/api(?:/|$) {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"statusCode":404,"message":"Not found"}';
    }

    location ~* ^/(login|register|library|farm|blog)(/|$) {
        return 302 /;
    }

    location ~* ^/games/(arena|high-low)(/|$) {
        return 302 /games;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

map $http_upgrade $community_connection_upgrade {
    default upgrade;
    ""      close;
}

map $http_x_forwarded_proto $community_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Caddy 是公网唯一入口，并会重写 X-Forwarded-For；127.0.0.1 直连烟测没有
# 该请求头，因此回退到连接地址。禁止把 community web 端口绑定到公网地址，
# 否则客户端可伪造该键绕过限流。
map $http_x_forwarded_for $community_rate_key {
    ""      $binary_remote_addr;
    default $http_x_forwarded_for;
}

# 分区避免高频 refresh/verify 挤占低频 register/resend 的预算。应用层仍需用
# Redis 叠加邮箱、registrationId 与账号维度限制；这里是抵挡入口 CPU 洪泛的第一层。
limit_req_zone $community_rate_key zone=community_register_ip:1m rate=2r/m;
limit_req_zone $community_rate_key zone=community_resend_ip:1m   rate=3r/m;
limit_req_zone $community_rate_key zone=community_verify_ip:1m   rate=15r/m;
limit_req_zone $community_rate_key zone=community_login_ip:1m    rate=10r/m;
limit_req_zone $community_rate_key zone=community_refresh_ip:1m  rate=60r/m;
limit_req_zone $community_rate_key zone=community_password_reset_request_ip:1m rate=3r/m;
limit_req_zone $community_rate_key zone=community_password_reset_ip:1m rate=10r/m;
limit_req_zone $community_rate_key zone=community_api_ip:2m      rate=20r/s;
limit_req_zone $community_rate_key zone=community_ws_ip:1m       rate=5r/s;
limit_conn_zone $community_rate_key zone=community_ws_connections:1m;

upstream community_api {
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;
    client_max_body_size 1m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    error_page 429 = @community_rate_limited;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-WebFish-Site-Mode "community" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' wss://$host; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header_inherit merge;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location @community_rate_limited {
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        default_type application/json;
        return 429 '{"statusCode":429,"code":"RATE_LIMITED","message":"Too many requests"}';
    }

    # 共用的 API 代理目标。白名单 location 通过 try_files 内部跳转到此处，
    # 原始 method/body/URI 保持不变，未列入白名单的 /api 仍由下方 404 兜底。
    location @community_api_proxy {
        add_header Cache-Control "no-store" always;
        proxy_http_version 1.1;
        proxy_pass http://community_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $community_forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 生产后端使用 __Host-zbrs_refresh、Path=/、SameSite=Strict；Nginx 再强制
        # Secure/HttpOnly/Strict，避免部署配置弱化刷新凭据。
        proxy_cookie_flags __Host-zbrs_refresh secure httponly samesite=strict;
    }

    # Cookie 创建与认证热点按风险分级限流。burst 只吸收短暂并发，
    # 超限统一经 @community_rate_limited 返回 429 + Retry-After。
    location ~ ^/api/v1/auth/register/?$ {
        limit_req zone=community_register_ip burst=2 nodelay;
        try_files /__community_api_proxy_never_exists__ @community_api_proxy;
    }

    location ~ ^/api/v1/auth/account/register/?$ {
        limit_req zone=community_register_ip burst=2 nodelay;
        try_files /__community_api_proxy_never_exists__ @community_api_proxy;
    }

    location ~ ^/api/v1/auth/email/verification-requests/?$ {
        limit_req zone=community_resend_ip burst=2 nodelay;
        try_files /__community_api_proxy_never_exists__ @community_api_proxy;
    }

    location ~ ^/api/v1/auth/(?:verify-email|email/verify)/?$ {
        limit_req zone=community_verify_ip burst=5 nodelay;
        try_files /__community_api_proxy_never_exists__ @community_api_proxy;
    }

    location ~ ^/api/v1/auth/login/?$ {
        limit_req zone=community_login_ip burst=10 nodelay;
        try_files /__community_api_proxy_never_exists__ @community_api_proxy;
    }

    location ~ ^/api/v1/auth/account/login/?$ {
        limit_req zone=community_login_ip burst=10 nodelay;
        try_files /__community_api_proxy_never_exists__ @community_api_proxy;
    }

    location ~ ^/api/v1/auth/refresh/?$ {
        limit_req zone=community_refresh_ip burst=30 nodelay;
        try_files /__community_api_proxy_never_exists__ @community_api_proxy;
    }

    location ~ ^/api/v1/auth/password-reset-requests/?$ {
        limit_req zone=community_password_reset_request_ip burst=2 nodelay;
        try_files /__community_api_proxy_never_exists__ @community_api_proxy;
    }

    location ~ ^/api/v1/auth/password-resets/?$ {
        limit_req zone=community_password_reset_ip burst=5 nodelay;
        try_files /__community_api_proxy_never_exists__ @community_api_proxy;
    }

    # 这是部署层第二道白名单。main.community.ts 仍必须只装载社区模块；
    # 此处明确不包含 documents/reading/memo/preferences/tools/skins 等旧 API。
    location ~ ^/api/(?:health(?:/ready)?|v1/(?:auth|me)(?:/.*)?|v1/(?:users|friends|friend-requests|blocks|referrals|feeds|farm|notifications|chat|news)(?:/.*)?|v1/community(?:/.*)?|v1/games/office-battle(?:/.*)?|v1/admin/(?:moderation|news|account-appeals)(?:/.*)?)$ {
        limit_req zone=community_api_ip burst=40 nodelay;
        try_files /__community_api_proxy_never_exists__ @community_api_proxy;
    }

    # 聊天室只允许这一条同源原生 WebSocket 路径；ticket 不出现在 URL 中。
    location = /ws/chat {
        limit_req zone=community_ws_ip burst=10 nodelay;
        limit_conn community_ws_connections 10;
        add_header Cache-Control "no-store" always;
        proxy_http_version 1.1;
        proxy_pass http://community_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $community_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $community_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        proxy_cookie_flags __Host-zbrs_refresh secure httponly samesite=strict;
    }

    # 任何其他 WebSocket/旧 socket.io 路径都不能回落为 SPA 200。
    location = /ws {
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 404 '{"statusCode":404,"message":"Not found"}';
    }

    location ^~ /ws/ {
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 404 '{"statusCode":404,"message":"Not found"}';
    }

    location ^~ /socket.io {
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 404 '{"statusCode":404,"message":"Not found"}';
    }

    location = /api {
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 404 '{"statusCode":404,"message":"Not found"}';
    }

    location /api/ {
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 404 '{"statusCode":404,"message":"Not found"}';
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

name: webfish-public

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: public-web
      args:
        VITE_API_BASE_URL: /api
        VITE_SITE_MODE: public
        VITE_SITE_NAME: ${SITE_NAME:-ZBRS 技术工具工坊}
        VITE_SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN must be set}
        VITE_ICP_BEIAN_NUMBER: ${ICP_BEIAN_NUMBER:-}
        VITE_PUBLIC_SECURITY_BEIAN_NUMBER: ${PUBLIC_SECURITY_BEIAN_NUMBER:-}
        VITE_PUBLIC_SECURITY_BEIAN_URL: ${PUBLIC_SECURITY_BEIAN_URL:-}
    image: webfish-public:${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.public:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:

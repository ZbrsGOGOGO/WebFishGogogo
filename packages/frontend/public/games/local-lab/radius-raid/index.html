<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Radius Raid: original 13 enemy types and 5 powerups. Silent self-hosted edition; statistics exist only while this game window is open. Keyboard and mouse required.">
  <title>Radius Raid · 摸司工作台</title>
  <link rel="icon" href="data:,">

  <nav id="lab-controls" aria-label="波次操作">
    <button id="lab-start" type="button" disabled>开始波次</button>
    <button id="lab-menu" type="button" disabled>返回菜单</button>
    <p id="lab-controls-help">WASD / 方向键移动，鼠标瞄准射击，P 暂停。返回菜单会结束当前波次。</p>

  </div></div></div>

  <script src="js/boot.js"></script>

  <script src="js/bullet.js"></script><script src="js/explosion.js"></script>
  <script src="js/powerup.js"></script><script src="js/particle.js"></script>
  <script src="js/particleemitter.js"></script><script src="js/textpop.js"></script>
  <script src="js/levelpop.js"></script><script src="js/button.js"></script>
  <script src="js/game.js"></script>
